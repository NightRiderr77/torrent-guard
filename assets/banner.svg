<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380"
     role="img" aria-label="torrent-guard — normal traffic passes, BitTorrent is dropped at the Xray routing layer.">
  <title>torrent-guard</title>
  <defs>
    <radialGradient id="halo" cx="14%" cy="6%" r="85%">
      <stop offset="0%"   stop-color="#8FD14F" stop-opacity=".18"/>
      <stop offset="50%"  stop-color="#8FD14F" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#8FD14F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8FD14F" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#8FD14F" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="trailG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C7F76E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C7F76E" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="trailR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E5484D" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8FD14F" opacity=".10"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".28"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", "DejaVu Sans Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      @keyframes flow { 0% { transform: translateX(0); opacity: 0 } 6% { opacity: 1 } 93% { opacity: 1 } 100% { transform: translateX(1056px); opacity: 0 } }
      /* the torrent packet never reaches the far side: it dies at the barrier */
      @keyframes stop { 0% { transform: translateX(0); opacity: 0 } 8% { opacity: 1 }
                       70% { transform: translateX(800px); opacity: 1 }
                       80% { transform: translateX(820px); opacity: 0 }
                      100% { transform: translateX(820px); opacity: 0 } }
      @keyframes flash { 0%, 62%, 100% { opacity: .35 } 72% { opacity: 1 } }
      .ok   { opacity: 0; animation: flow 4.6s cubic-bezier(.5,0,.5,1) infinite both; }
      .bad  { opacity: 0; animation: stop 4.6s cubic-bezier(.35,0,.6,1) infinite both; }
      .bar  { animation: flash 4.6s linear infinite; }
      @media (prefers-reduced-motion: reduce) { .ok, .bad, .bar { animation: none } .bad { opacity: 1 } .bar { opacity: 1 } }
    </style>
  </defs>

  <rect width="1200" height="380" fill="#060806"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" fill="url(#halo)"/>

  <text class="mono" x="72" y="80" fill="#4F6140" font-size="13.5" letter-spacing="5.5">XRAY &#183; 3X-UI &#183; VPN OPERATORS</text>
  <g class="mono" font-size="58" font-weight="700" letter-spacing="-1">
    <text x="72" y="146" fill="#8FD14F" opacity=".45" filter="url(#soft)">torrent-guard</text>
    <text x="72" y="146" fill="#EAEEE4">torrent-guard</text>
  </g>
  <rect x="72" y="166" width="124" height="3" fill="#A32424"/>
  <text class="mono" x="72" y="200" fill="#8FD14F" font-size="16" letter-spacing="2.2">MAKES THE BITTORRENT BLOCK ACTUALLY BLOCK</text>

  <g transform="translate(1128 72)">
    <rect x="-176" y="-20" width="176" height="34" rx="17" fill="#0B0F0B" stroke="#8FD14F" stroke-opacity=".35"/>
    <text class="mono" x="-88" y="2" fill="#8FD14F" font-size="12.5" letter-spacing="2.4" text-anchor="middle">AUDIT &#183; THEN FIX</text>
  </g>

  <!-- lane 1: everything else goes straight through -->
  <text class="mono" x="72" y="258" fill="#4F6140" font-size="11.5" letter-spacing="3">HTTPS &#183; STREAMING &#183; GAMING</text>
  <line x1="72" y1="278" x2="1128" y2="278" stroke="#22301B" stroke-width="3"/>
  <line x1="72" y1="278" x2="1128" y2="278" stroke="url(#pass)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g class="ok">
    <rect x="26" y="276.5" width="46" height="3" fill="url(#trailG)" rx="1.5"/>
    <circle cx="72" cy="278" r="8" fill="#C7F76E" opacity=".3" filter="url(#soft2)"/>
    <circle cx="72" cy="278" r="3.6" fill="#EAFFC4"/>
  </g>
  <text class="mono" x="1128" y="262" fill="#8FD14F" font-size="11.5" letter-spacing="3" text-anchor="end">PASS</text>

  <!-- lane 2: bittorrent stops at the barrier -->
  <text class="mono" x="72" y="318" fill="#5C3A3A" font-size="11.5" letter-spacing="3">BITTORRENT &#183; DHT &#183; PEX</text>
  <line x1="72" y1="338" x2="892" y2="338" stroke="#301B1B" stroke-width="3"/>
  <line x1="72" y1="338" x2="892" y2="338" stroke="#E5484D" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <line x1="908" y1="338" x2="1128" y2="338" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="4 10"/>
  <g class="bad">
    <rect x="26" y="336.5" width="46" height="3" fill="url(#trailR)" rx="1.5"/>
    <circle cx="72" cy="338" r="8" fill="#E5484D" opacity=".35" filter="url(#soft2)"/>
    <circle cx="72" cy="338" r="3.6" fill="#FF8A8E"/>
  </g>
  <text class="mono" x="1128" y="322" fill="#8B4A4A" font-size="11.5" letter-spacing="3" text-anchor="end">DROPPED</text>

  <!-- the barrier -->
  <g class="bar">
    <rect x="896" y="306" width="8" height="54" rx="4" fill="#E5484D" opacity=".9"/>
    <rect x="896" y="306" width="8" height="54" rx="4" fill="#E5484D" filter="url(#soft2)" opacity=".5"/>
  </g>
  <text class="mono" x="900" y="298" fill="#E5484D" font-size="11" letter-spacing="3" text-anchor="middle">BLACKHOLE</text>

  <rect width="1200" height="380" fill="url(#scan)" pointer-events="none"/>
</svg>
